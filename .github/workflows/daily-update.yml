name: Daily model update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 120 -r requirements.txt

      - name: Refresh model outputs
        run: |
          python src/ethanol_mt_model.py --years-back 5 --output-dir outputs --cache-dir data/cache
          python src/build_dashboard.py
          python src/build_interactive_dashboard.py

      - name: Commit refreshed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs dashboard
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update model outputs"
            git push
          fi
